name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A secret or a token in the tree or in the history fails the build.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --config /repo/.gitleaks.toml

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Integration tests start their own Postgres through Testcontainers (Docker is on the runner).
      - run: dotnet test Pitwall.slnx

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pitwall/sdk build
      - run: pnpm --filter @pitwall/sdk test
      - run: pnpm --filter pitwall-mcp test
      - run: pnpm --filter @pitwall/console typecheck
      - run: pnpm --filter @pitwall/console build
      # The Atlas in a real browser, desktop and phone; the tests answer for the API.
      - run: pnpm --filter @pitwall/console exec playwright install --with-deps chromium
      - run: pnpm --filter @pitwall/console test:e2e

  # The same compose file the server runs: a broken image or bucket stops the deploy here, because
  # deploy/auto-update.sh only takes commits whose CI passed.
  prod-stack:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres
      PITWALL_SECRET_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      SEAWEEDFS_ACCESS_KEY: pitwall
      SEAWEEDFS_SECRET_KEY: ci-seaweedfs-secret
      PITWALL_REQUIRE_TOTP: 'false'
      PITWALL_ADMIN_EMAIL: admin@pitwall.test
      PITWALL_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: docker compose -f docker-compose.prod.yml up -d --build
      - run: node scripts/smoke-prod.mjs
        env:
          ADMIN_EMAIL: admin@pitwall.test
          ADMIN_PASSWORD: ci-admin-password
      # The smoke test also passes when the API writes to disk, so prove the video reached the bucket.
      - run: test "$(docker compose -f docker-compose.prod.yml exec -T seaweedfs du -sm /data | cut -f1)" -ge 30
      - run: PITWALL_DIR="$PWD" bash deploy/backup.sh
      - run: find backups/anexos -name '*.mp4' -size +29M | grep .
      - if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=100
